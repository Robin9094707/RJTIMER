name: RJUltraTimer

options:
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.1"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  RJUltraTimer:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Resources
      - path: Shared
    resources:
      - path: App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.ultratimer
        PRODUCT_NAME: RJ UltraTimer
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: RJUltraTimerWidgets
        embed: true
        codeSign: false

  RJUltraTimerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.ultratimer.widgets
        PRODUCT_NAME: RJUltraTimerWidgets
        INFOPLIST_FILE: WidgetExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

schemes:
  RJUltraTimer:
    build:
      targets:
        RJUltraTimer: all
        RJUltraTimerWidgets: all
    run:
      config: Debug
    archive:
      config: Release
