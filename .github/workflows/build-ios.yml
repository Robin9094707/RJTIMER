name: Build RJ UltraTimer IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path
          echo "Available destinations:"
          xcodebuild -showsdks

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml

      - name: Build unsigned app
        id: build
        shell: bash
        run: |
          set -o pipefail
          rm -rf .github-derived

          xcodebuild \
            -project RJUltraTimer.xcodeproj \
            -scheme RJUltraTimer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.github-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee RJ-UltraTimer-build.log

      - name: Create unsigned IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APP="$(find "$PWD/.github-derived/Build/Products/Release-iphoneos" \
            -maxdepth 1 \
            -name '*.app' \
            -type d \
            -print \
            -quit)"

          if [ -z "$APP" ]; then
            echo "No .app found."
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/

          /usr/bin/zip -qry RJ-UltraTimer-unsigned.ipa Payload
          unzip -t RJ-UltraTimer-unsigned.ipa

          echo "IPA created:"
          ls -lh RJ-UltraTimer-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-UltraTimer-unsigned-IPA
          path: RJ-UltraTimer-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-UltraTimer-build-log
          path: RJ-UltraTimer-build.log
          if-no-files-found: ignore
          retention-days: 7
